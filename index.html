<!doctype html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>김지훈 포트폴리오</title>
  <meta name="description" content="백엔드 개발자 김지훈의 경력, 프로젝트, 측정 결과">
  <meta property="og:type" content="website">
  <meta property="og:title" content="김지훈 포트폴리오">
  <meta property="og:description" content="백엔드 개발자 김지훈의 경력, 프로젝트, 측정 결과">
  <meta property="og:url" content="https://jjiggu.github.io/">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23060916'/%3E%3Ctext x='16' y='23' font-family='system-ui,sans-serif' font-size='20' font-weight='800' text-anchor='middle' fill='%23ffd84a'%3EJ%3C/text%3E%3C/svg%3E">
  <script>
    // 기본은 라이트 모드(html의 data-theme), 다크를 골라 저장해 둔 방문자만 다크 (첫 화면이 깜빡이지 않게 그리기 전에 정함)
    (function () { var t = null; try { t = localStorage.getItem('theme'); } catch (e) {} document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light'; })();
    // WebGL로 이름을 그릴 수 있으면 글자를 미리 투명하게 (깜빡임 방지). 실패하면 stream.js가 되돌림
    // stream.js(three.js 포함)가 로드에 실패하거나 4초 안에 준비되지 않으면 원래 글자를 보여 줌
    function showName() { document.documentElement.classList.remove('gl-hero'); }
    // 첫 화면 연출(점이 모여 이름이 됨)을 틀 환경이면, 글이 먼저 보였다 사라지지 않게 그리기 전에 가려 둠.
    // main.js가 3초 안에 넘겨받지 못하면(스크립트 실패 등) 가린 것을 풀어 그대로 보여 줌
    function showHero() { document.documentElement.classList.remove('intro'); }
    (function () { try { if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.documentElement.classList.add('intro'); window.introTimer = setTimeout(showHero, 3000);
      if (document.createElement('canvas').getContext('webgl2')) { document.documentElement.classList.add('gl-hero'); window.glHeroTimer = setTimeout(showName, 4000); }
    } } catch (e) {} })();
    // 저사양 기기(코어·메모리 4 이하)는 처음부터 가벼운 모드: 배경 흐림을 끄고 점 개수와 해상도를 줄임. 느린 프레임이 재어져도 fx.js가 켬
    if ((navigator.hardwareConcurrency || 8) <= 4 || (navigator.deviceMemory || 8) <= 4) document.documentElement.classList.add('lite');
  </script>
  <link rel="preload" href="vendor/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="vendor/big-shoulders-display-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="vendor/lenis.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#main">본문으로 건너뛰기</a>
  <div class="progress" aria-hidden="true"></div>
  <!-- 점이 첫 화면의 이름을 그리고 그 주위를 떠다니다, Contact에서 다시 모여 이름이 됨. 본문에서는 꺼 둠 (stream.js) -->
  <canvas id="gl" aria-hidden="true"></canvas>

  <header class="nav">
    <a class="nav__name" href="#top">Jihoon Kim</a>
    <nav aria-label="섹션 이동">
      <a href="#overview">Summary</a>
      <a href="#career">Work Experience</a>
      <a href="#projects">Projects</a>
      <a href="#contact">Contact</a>
      <i class="nav__pill" aria-hidden="true"></i>
    </nav>
    <button type="button" class="theme" id="theme" aria-label="라이트 모드로 바꾸기">
      <!-- 달 ↔ 해: 모션이 켜진 환경에서는 달 모양이 해로 변함 (GSAP MorphSVG, fx.js). 아니면 CSS가 둘 중 하나만 보여 줌 -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path class="t-moon" fill="currentColor" d="M20.3 14.6A8.5 8.5 0 0 1 9.4 3.7a8.5 8.5 0 1 0 10.9 10.9z"/>
        <path class="t-sun" fill="currentColor" d="M12 7.8a4.2 4.2 0 1 0 0 8.4a4.2 4.2 0 1 0 0-8.4z"/>
        <g class="t-rays" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 4.9V2.5"/><path d="M17 7l1.7-1.7"/><path d="M19.1 12h2.4"/><path d="M17 17l1.7 1.7"/><path d="M12 19.1v2.4"/><path d="M7 17l-1.7 1.7"/><path d="M4.9 12H2.5"/><path d="M7 7 5.3 5.3"/></g>
      </svg>
    </button>
  </header>

  <main id="main">
    <section class="hero" id="top">
      <div class="hero__in">
        <p class="hero__role" id="role"></p>
        <h1 class="hero__name" id="name"></h1>
        <p class="hero__intro" id="line"></p>
        <ul class="links" id="hero-links" aria-label="연락처"></ul>
      </div>
      <a class="hero__cue" href="#overview" aria-label="아래 Summary로 이동"><span>Scroll</span><i></i></a>
    </section>

    <section class="overview" id="overview" aria-labelledby="h-overview">
      <header class="sec-head">
        <span class="num">01</span><h2 id="h-overview">Summary</h2>
      </header>
      <div class="overview__track" id="overview-track"></div>
    </section>

    <section class="block" id="career" aria-labelledby="h-career">
      <header class="sec-head"><span class="num">02</span><h2 id="h-career">Work Experience</h2></header>
      <div id="career-list"></div>
    </section>

    <section class="block" id="projects" aria-labelledby="h-projects">
      <header class="sec-head"><span class="num">03</span><h2 id="h-projects">Projects</h2></header>
      <div id="project-list"></div>
    </section>
  </main>

  <footer class="foot" id="contact" aria-labelledby="h-contact">
    <div class="foot__main">
      <h2 class="foot__h" id="h-contact">Contact</h2>
      <!-- 첫 화면의 이름을 그리던 점이 여기서 다시 모여 이름이 됨. 이름은 h1에 이미 있어 여기서는 장식 (stream.js) -->
      <p class="foot__name" id="foot-name" aria-hidden="true"></p>
      <ul class="links" id="foot-links" aria-label="연락처"></ul>
    </div>
    <div class="foot__base">
      <p>© 2026 김지훈</p>
      <a class="totop" href="#top">맨 위로 ↑</a>
    </div>
  </footer>

  <!-- 쿠폰 프로젝트의 '직접 해 보기'. main.js가 #coupon의 사례 뒤에 붙인 뒤 sim.js가 그립니다. -->
  <template id="tpl-coupon-demo">
    <section class="demo cp" aria-label="선착순 쿠폰 동시성 시뮬레이션">
      <div class="demo__intro">
        <header class="ev__head">
          <p class="eyebrow">선착순 쿠폰 발급 시뮬레이션</p>
          <h3 class="ev__title">선착순 쿠폰 발급을 직접 돌려 보세요</h3>
        </header>
      </div>
      <div class="split dock">
        <div class="dock__tabs" id="sim-tabs"></div>
        <div>
          <p class="dock__title">시나리오 <span id="sim-scen"></span></p>
          <dl class="dock__stats" id="sim-stats"></dl>
          <p class="dock__verdict" id="sim-verdict" aria-live="polite"></p>
          <p class="dock__fact"><b>실측</b> <span id="sim-fact"></span></p>
          <p class="dock__note">위 수치는 브라우저에서 돌린 시뮬레이션 결과이고, 실제보다 느리게 재생됩니다. <button type="button" id="sim-again">다시 실행</button></p>
        </div>
      </div>
      <div class="sim"><canvas id="sim" aria-hidden="true"></canvas><div class="sim__trace" id="sim-trace" aria-live="polite" hidden></div></div>
    </section>
  </template>

  <script src="vendor/gsap.min.js"></script>
  <script src="vendor/ScrollTrigger.min.js"></script>
  <script src="vendor/SplitText.min.js"></script>
  <script src="vendor/ScrambleTextPlugin.min.js"></script>
  <script src="vendor/DrawSVGPlugin.min.js"></script>
  <script src="vendor/MotionPathPlugin.min.js"></script>
  <script src="vendor/Flip.min.js"></script>
  <script src="vendor/CustomEase.min.js"></script>
  <script src="vendor/MorphSVGPlugin.min.js"></script>
  <script src="vendor/lenis.min.js"></script>
  <script src="data.js"></script>
  <script src="main.js"></script>
  <script src="fx.js"></script>
  <script src="sim.js"></script>
  <script src="evidence.js"></script>
  <script src="nowait-demo.js"></script>
  <script src="nowait-ui.js"></script>
  <script src="gasip-demo.js"></script>
  <script src="gasip-ui.js"></script>
  <script type="module" src="stream.js" onerror="showName()"></script>
</body>
</html>
